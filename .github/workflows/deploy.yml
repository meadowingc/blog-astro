name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          path: blog-astro

      - name: Checkout Obsidian Brain to source posts
        uses: actions/checkout@v4
        with:
          repository: meadowingc/obsidian-brain
          path: obsidian-brain
          token: ${{ secrets.OBSIDIAN_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: blog-astro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: blog-astro

      - name: Download TTS audio manifest
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (compatible; AstroBuild/1.0)" \
            -H "Accept: application/json" \
            -o blog-astro/tts-manifest.json \
            "https://post-audios.meadow.cafe/manifest.json" \
          || echo "::warning::Failed to download TTS manifest — blog posts will not have audio players"

      - name: Build the site
        uses: withastro/action@v2
        env:
          READECK_TOKEN: ${{ secrets.READECK_TOKEN }}
        with:
          path: ./blog-astro

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
